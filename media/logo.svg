<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A magnifier.

       The control turns a lookup column into a type-ahead over the target
       table, and the search glyph is what a maker is looking for in a gallery.
       Its neighbour pcf-view-filter is the other searching control here, and it
       gets the funnel: that one narrows a view, this one finds a record.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.
       Both strokes sample it, so the lens and the handle are one object rather
       than two shapes that meet.

       Drawn for 32px. Stroke 11 on a lens of r 21 is the heaviest ring that
       still leaves a hole at 24; at 13 the lens fills in and the mark becomes a
       lollipop.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="lookup-search-ramp" x1="4" y1="80" x2="92" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The lens. -->
  <circle cx="42" cy="42" r="21" stroke="url(#lookup-search-ramp)" stroke-width="11" fill="none"/>

  <!-- The handle. -->
  <path d="M58 58 L80 80" stroke="url(#lookup-search-ramp)" stroke-width="11" stroke-linecap="round"/>
</svg>
